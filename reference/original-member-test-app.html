async function renderAccount(container) {
  const me = state.me || {};
  const blocks = el('div', {}, loadingText());
  const exportBox = el('div', {}, loadingText());
  const healthBox = el('div', {}, loadingText());
  container.replaceChildren(
    el('div', { className: 'card' },
      el('h2', {}, 'Account'),
      el('dl', { className: 'kv' },
        el('dt', {}, 'Member id'), el('dd', {}, me.id || state.session.userId),
        el('dt', {}, 'Phone'), el('dd', {}, me.phoneNumber || '—'),
        el('dt', {}, 'Email'), el('dd', {}, me.email || '—'),
      ),
      el('div', { className: 'actions' },
        el('button', { className: 'ghost', onClick: logout }, 'Log out'),
        el('button', { className: 'ghost', onClick: (event) => logoutEverywhere(event.currentTarget) }, 'Sign out of all devices')),
    ),
    el('div', { className: 'card' }, el('h2', {}, 'Blocked members'), blocks),
    el('div', { className: 'card' }, el('h2', {}, 'Your data'), exportBox),
    el('div', { className: 'card' }, el('h2', {}, 'Server status'), healthBox),
    el('div', { className: 'card' },
      el('h2', {}, 'Delete account'),
      el('p', { className: 'hint' }, 'Your profile is hidden right away and deleted after a grace period. Signing in again before then cancels the deletion.'),
      el('div', { className: 'actions' }, el('button', { className: 'danger', onClick: openDeleteAccountSheet }, 'Delete my account')),
    ),
  );

  const [blockData, exportStatus, health] = await Promise.all([
    attempt(null, () => api('GET', '/blocks?limit=50')),
    attempt(null, () => api('GET', '/account/export-status')),
    api('GET', '/health').catch((error) => ({ status: 'down', error })),
  ]);

  if (blockData) {
    blocks.replaceChildren(...(blockData.items.length === 0
      ? [el('p', { className: 'hint', style: 'margin-top:8px' }, 'You have not blocked anyone.')]
      : blockData.items.map((item) => el('div', { className: 'list-item' },
        el('div', { style: 'flex:1' }, el('strong', {}, item.user.displayName), el('div', { className: 'muted' }, `Blocked ${new Date(item.blockedAt).toLocaleString()}`)),
        el('button', { className: 'ghost small', onClick: (event) => attempt(event.currentTarget, async () => {
          await api('DELETE', `/users/${item.user.id}/block`);
          toast('Unblocked', 'success');
          renderAccount(container);
        }) }, 'Unblock'),
      ))));
  }

  if (exportStatus) {
    exportBox.replaceChildren(el('div', {},
      el('p', { style: 'margin-top:8px' }, 'Data export: ', statusPill(exportStatus.status)),
      exportStatus.status === 'READY' && exportStatus.downloadUrl
        ? el('a', { href: exportStatus.downloadUrl, target: '_blank', rel: 'noopener' }, 'Download your data') : null,
      exportStatus.expiresAt ? el('p', { className: 'muted' }, `Link expires ${new Date(exportStatus.expiresAt).toLocaleString()}`) : null,
    ));
  }

  healthBox.replaceChildren(health.error
    ? el('p', { style: 'margin-top:8px' }, statusPill('down'), ' ', errorText(health.error))
    : el('dl', { className: 'kv' },
      el('dt', {}, 'API'), el('dd', {}, statusPill(health.status)),
      el('dt', {}, 'Database'), el('dd', {}, health.database),
      el('dt', {}, 'Environment'), el('dd', {}, health.environment),
      el('dt', {}, 'Uptime'), el('dd', {}, `${Math.round(health.uptime / 60)} min`),
    ));
}

// Scheduling deletion revokes every session, so the member is signed out right after.
function openDeleteAccountSheet() {
  openSheet((close) => {
    const reason = el('input', { maxlength: '100', placeholder: 'Optional — why are you leaving?' });
    const feedback = el('textarea', { maxlength: '1000', placeholder: 'Optional feedback' });
    const confirmInput = el('input', { placeholder: 'Type DELETE to confirm', autocomplete: 'off' });
    const confirmButton = el('button', { className: 'danger', disabled: true }, 'Delete account');
    confirmInput.addEventListener('input', () => { confirmButton.disabled = confirmInput.value.trim() !== 'DELETE'; });
    confirmButton.addEventListener('click', () => attempt(confirmButton, async () => {
      const result = await api('POST', '/account/deletion-request', {
        body: { confirm: true, reason: reason.value.trim() || undefined, feedback: feedback.value.trim() || undefined },
      });
      close();
      signOutLocally(`Account deletion scheduled for ${new Date(result.scheduledFor).toLocaleDateString()}. Sign in again before then to cancel it.`);
    }));
    return el('div', { className: 'modal' },
      el('div', { className: 'sheet-handle' }),
      el('h2', {}, 'Delete your account?'),
      el('p', { className: 'hint' }, 'You will be signed out on every device. Your matches and chats disappear for others.'),
      el('label', {}, 'Reason'), reason,
      el('label', {}, 'Feedback'), feedback,
      el('label', {}, 'Confirm'), confirmInput,
      el('div', { className: 'actions' }, confirmButton, el('button', { className: 'ghost', onClick: close }, 'Cancel')),
    );
  });
}

start();
</script>
</body>
</html>
